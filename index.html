<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Laucha</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body { 
            font-family: 'Press Start 2P', cursive; 
            background-color: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #ffffff; 
            margin: 0; 
            text-transform: uppercase;
        }
        
        .contenedor { 
            background: #0a1435; 
            padding: 25px; 
            border: 4px solid #1d4ed8; 
            box-shadow: 8px 8px 0px #ff7300; 
            text-align: center; 
            max-width: 380px; 
            width: 90%; 
        }
        
        h2 { 
            margin: 0 0 20px 0; 
            color: #ff7300; 
            font-size: 1.2rem;
            text-shadow: 3px 3px 0px #000000;
            line-height: 1.5;
        }

        .btn-espiar {
            background-color: #000000;
            color: #ff7300;
            border: 4px dashed #ff7300;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 0.6rem;
            width: 100%;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 4px 4px 0px #000000;
        }

        .btn-espiar:hover {
            background-color: #ff7300;
            color: #000000;
        }

        .btn-espiar:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000000;
        }
        
        .diccionario { 
            display: none;
            background: #000000; 
            padding: 15px; 
            font-size: 0.55rem; 
            margin-bottom: 25px; 
            color: #ffffff;
            border: 2px dashed #1d4ed8;
            line-height: 2;
        }
        
        .diccionario strong { 
            color: #ff7300; 
            display: block;
            margin-bottom: 10px;
            font-size: 0.7rem;
        }
        
        .pantalla-completa { 
            background-color: #020612; 
            border: 4px solid #1d4ed8;
            margin-bottom: 25px; 
            box-shadow: inset 4px 4px 0px #000000;
        }
        
        input#pantallaFormula { 
            width: 100%; 
            padding: 15px; 
            font-size: 0.7rem; 
            text-align: right; 
            border: none; 
            color: #ffffff; 
            background: transparent; 
            outline: none; 
            box-sizing: border-box;
            font-family: 'Press Start 2P', cursive;
        }
        
        #resultadoArea { 
            font-size: 1.2rem; 
            color: #ff7300; 
            padding: 5px 15px 15px 15px; 
            min-height: 30px; 
            text-align: right; 
            box-sizing: border-box;
            word-wrap: break-word;
        }
        
        .teclado { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
        }
        
        button { 
            width: 100%; 
            padding: 15px 5px; 
            font-size: 0.55rem; 
            cursor: pointer; 
            border: 4px solid #000000; 
            font-family: 'Press Start 2P', cursive;
            transition: none;
            box-shadow: 4px 4px 0px #000000;
        }
        
        button:active { 
            transform: translate(4px, 4px); 
            box-shadow: 0px 0px 0px #000000;
        }
        
        .btn-valor { background-color: #1d4ed8; color: #ffffff; }
        .btn-valor:hover { background-color: #2563eb; }
        .btn-operador { background-color: #ff7300; color: #ffffff; font-size: 1rem; }
        .btn-operador:hover { background-color: #fb923c; }
        .btn-clear { background-color: #dc2626; color: white; grid-column: span 1; }
        .btn-clear:hover { background-color: #ef4444; }
        .btn-equal { background-color: #ff7300; color: white; font-size: 1.2rem; grid-column: span 2; }
        .btn-equal:hover { background-color: #fb923c; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>🐭CALCULAUCHA🐭</h2>
        
        <button class="btn-espiar" onclick="toggleValores()">ESPIAR VALORES</button>

        <div class="diccionario" id="cajaValores">
            <strong>VALORES</strong>
            YUTA: 7 | TUYA: 9 | CANDIDA: -1<br><br>
            LIBRE: 10 | LOCA: 8 | LINDA: 5
        </div>

        <div class="pantalla-completa">
            <input type="text" id="pantallaFormula" readonly placeholder="...">
            <div id="resultadoArea">0</div>
        </div>

        <div class="teclado">
            <button class="btn-valor" onclick="añadirToken('YUTA')">YUTA</button>
            <button class="btn-valor" onclick="añadirToken('TUYA')">TUYA</button>
            <button class="btn-valor" onclick="añadirToken('CANDIDA')">CANDIDA</button>
            
            <button class="btn-valor" onclick="añadirToken('LIBRE')">LIBRE</button>
            <button class="btn-valor" onclick="añadirToken('LOCA')">LOCA</button>
            <button class="btn-valor" onclick="añadirToken('LINDA')">LINDA</button>
            
            <button class="btn-operador" onclick="añadirToken('+')">+</button>
            <button class="btn-operador" onclick="añadirToken('-')">-</button>
            <button class="btn-operador" onclick="añadirToken('*')">x</button>
            
            <button class="btn-operador" onclick="añadirToken('/')">/</button>
            <button class="btn-clear" onclick="limpiarCalculadora()">C</button>
            <button class="btn-equal" onclick="procesarCalculo()">=</button>
        </div>
    </div>

    <script>
        function toggleValores() {
            const caja = document.getElementById("cajaValores");
            if (caja.style.display === "block") {
                caja.style.display = "none";
            } else {
                caja.style.display = "block";
            }
        }

        const mapaValores = {
            "YUTA": 7,
            "TUYA": 9,
            "CANDIDA": -1,
            "LIBRE": 10,
            "LOCA": 8,
            "LINDA": 5
        };

        const operadoresValidos = ['+', '-', '*', '/'];
        let formulaActualString = "";

        const elPantallaFormula = document.getElementById("pantallaFormula");
        const elResultadoArea = document.getElementById("resultadoArea");

        function añadirToken(token) {
            if (formulaActualString === "") {
                formulaActualString = token;
            } else {
                formulaActualString += " " + token; 
            }
            if(elResultadoArea.innerHTML === "ERR" || elResultadoArea.innerHTML === "0") {
                elResultadoArea.innerHTML = "";
            }
            actualizarPantallas();
        }

        function limpiarCalculadora() {
            formulaActualString = "";
            elResultadoArea.innerHTML = "0";
            actualizarPantallas();
        }

        function actualizarPantallas() {
            elPantallaFormula.value = formulaActualString;
        }

        function procesarCalculo() {
            if (formulaActualString.trim() === "") return;

            let partesParsed = formulaActualString.trim().split(" ");
            let expresionFinalTraducida = "";

            for (let i = 0; i < partesParsed.length; i++) {
                let parte = partesParsed[i];
                if (parte === "") continue; 
                
                if (operadoresValidos.includes(parte)) {
                    expresionFinalTraducida += parte + " ";
                } else if (mapaValores[parte] !== undefined) {
                    let val = mapaValores[parte];
                    expresionFinalTraducida += (val < 0 ? "(" + val + ")" : val) + " ";
                } else {
                    elResultadoArea.innerHTML = "ERR";
                    return;
                }
            }

            try {
                let resultadoNumerico = eval(expresionFinalTraducida);
                if (!isFinite(resultadoNumerico)) {
                    elResultadoArea.innerHTML = "ERR";
                    return;
                }
                
                if(resultadoNumerico % 1 !== 0) {
                    resultadoNumerico = resultadoNumerico.toFixed(2);
                }
                
                elResultadoArea.innerHTML = resultadoNumerico;
            } catch (error) {
                elResultadoArea.innerHTML = "ERR";
            }
        }
    </script>
</body>
</html>
