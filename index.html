<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Laucha</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000000; display: flex; justify-content: center; padding-top: 50px; color: #ffffff; margin: 0; }
        .contenedor { background: #0a1435; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(255, 115, 0, 0.4); text-align: center; max-width: 380px; width: 100%; border: 2px solid #ff7300; }
        h2 { margin-bottom: 15px; color: #ff7300; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .pantalla-completa { border: 1px solid #1d4ed8; background-color: #000000; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        input#pantallaFormula { width: 95%; padding: 15px; font-size: 1.1em; text-align: left; border: none; color: #ffffff; background: transparent; outline: none; }
        #resultadoArea { font-size: 1.5em; font-weight: bold; color: #ff7300; padding: 15px; min-height: 40px; text-align: right; background-color: #030816; border-top: 1px solid #1d4ed8; }
        .diccionario { text-align: left; background: #030816; padding: 10px; border-radius: 5px; font-size: 0.85em; margin-bottom: 20px; color: #ffffff; border: 1px solid #1d4ed8; }
        .diccionario strong { color: #ff7300; }
        .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        button { width: 100%; padding: 20px 10px; font-size: 1.1em; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; transform: translateY(0px); transition: all 0.1s; }
        button:active { transform: translateY(2px); box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .btn-valor { background-color: #1d4ed8; color: #ffffff; }
        .btn-valor:hover { background-color: #2563eb; }
        .btn-operador { background-color: #ff7300; color: #ffffff; font-size: 1.3em; }
        .btn-operador:hover { background-color: #ff8c33; }
        .btn-clear { background-color: #cc0000; color: white; grid-column: span 1; }
        .btn-clear:hover { background-color: #ff0000; }
        .btn-equal { background-color: #ff7300; color: white; font-size: 1.3em; grid-column: span 2; }
        .btn-equal:hover { background-color: #ff8c33; }
    </style>
</head>
<body>
    
    <div class="contenedor">
        <h2>🐭CalcuLaucha🐭</h2>
    
 

        <div class="pantalla-completa">
            <input type="text" id="pantallaFormula" readonly placeholder="...">
            <div id="resultadoArea"></div>
        </div>

        <div class="teclado">
            <button class="btn-valor" onclick="añadirToken('YUTA')">YUTA</button>
            <button class="btn-valor" onclick="añadirToken('TUYA')">TUYA</button>
            <button class="btn-valor" onclick="añadirToken('CANDIDA')">CANDIDA</button>
            
            <button class="btn-valor" onclick="añadirToken('LIBRE')">LIBRE</button>
            <button class="btn-valor" onclick="añadirToken('LOCA')">LOCA</button>
            <button class="btn-valor" onclick="añadirToken('LINDA')">LINDA</button>
            
            <button class="btn-operador" onclick="añadirToken('+')">+</button>
            <button class="btn-operador" onclick="añadirToken('-')">-</button>
            <button class="btn-operador" onclick="añadirToken('*')">×</button>
            
            <button class="btn-operador" onclick="añadirToken('/')">÷</button>
            <button class="btn-clear" onclick="limpiarCalculadora()">C</button>
            <button class="btn-equal" onclick="procesarCalculo()">=</button>
        </div>
    </div>

    <script>
        const mapaValores = {
            "YUTA": 7,
            "TUYA": 9,
            "CANDIDA": -1,
            "LIBRE": 10,
            "LOCA": 8,
            "LINDA": 5
        };

        const operadoresValidos = ['+', '-', '*', '/'];
        let formulaActualString = "";

        const elPantallaFormula = document.getElementById("pantallaFormula");
        const elResultadoArea = document.getElementById("resultadoArea");

        function añadirToken(token) {
            if (formulaActualString === "") {
                formulaActualString = token;
            } else {
                formulaActualString += " " + token; 
            }
            elResultadoArea.innerHTML = ""; 
            actualizarPantallas();
        }

        function limpiarCalculadora() {
            formulaActualString = "";
            elResultadoArea.innerHTML = "";
            actualizarPantallas();
        }

        function actualizarPantallas() {
            elPantallaFormula.value = formulaActualString;
        }

        function procesarCalculo() {
            if (formulaActualString.trim() === "") {
                elResultadoArea.innerHTML = "❌";
                return;
            }

            let partesParsed = formulaActualString.trim().split(" ");
            let expresionFinalTraducida = "";

            for (let i = 0; i < partesParsed.length; i++) {
                let parte = partesParsed[i];
                if (parte === "") continue; 
                
                if (operadoresValidos.includes(parte)) {
                    expresionFinalTraducida += parte + " ";
                } else if (mapaValores[parte] !== undefined) {
                    expresionFinalTraducida += "(" + mapaValores[parte] + ") ";
                } else {
                    elResultadoArea.innerHTML = "❌";
                    return;
                }
            }

            try {
                let resultadoNumerico = eval(expresionFinalTraducida);
                if (!isFinite(resultadoNumerico)) {
                    elResultadoArea.innerHTML = "❌";
                    return;
                }
                elResultadoArea.innerHTML = resultadoNumerico;
            } catch (error) {
                elResultadoArea.innerHTML = "❌";
            }
        }
    </script>
</body>
</html>
