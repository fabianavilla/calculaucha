<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Laucha</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body { 
            font-family: 'Press Start 2P', cursive; 
            background-color: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #ffffff; 
            margin: 0; 
            text-transform: uppercase;
        }
        
        .contenedor { 
            background: #0a1435; 
            padding: 25px; 
            border: 4px solid #1d4ed8; 
            box-shadow: 8px 8px 0px #ff7300; 
            text-align: center; 
            max-width: 380px; 
            width: 90%; 
        }
        
        h2 { 
            margin: 0 0 20px 0; 
            color: #ff7300; 
            font-size: 1.2rem;
            text-shadow: 3px 3px 0px #000000;
            line-height: 1.5;
        }

        .btn-espiar {
            background-color: #000000;
            color: #ff7300;
            border: 4px dashed #ff7300;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 0.6rem;
            width: 100%;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 4px 4px 0px #000000;
        }

        .btn-espiar:hover {
            background-color: #ff7300;
            color: #000000;
        }

        .btn-espiar:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000000;
        }
        
        .diccionario { 
            display: none;
            background: #000000; 
            padding: 15px; 
            font-size: 0.55rem; 
            margin-bottom: 25px; 
            color: #ffffff;
            border: 2px dashed #1d4ed8;
            line-height: 2;
        }
        
        .diccionario strong { 
            color: #ff7300; 
            display: block;
            margin-bottom: 10px;
            font-size: 0.7rem;
        }
        
        .pantalla-completa { 
            background-color: #020612; 
            border: 4px solid #1d4ed8;
            margin-bottom: 25px; 
            box-shadow: inset 4px 4px 0px #000000;
        }
        
        input#pantallaFormula { 
            width: 100%; 
            padding: 15px; 
            font-size: 0.7rem; 
            text-align: right; 
            border: none; 
            color: #ffffff; 
            background: transparent; 
            outline: none; 
            box-sizing: border-box;
            font-family: 'Press Start 2P', cursive;
        }
        
        #resultadoArea { 
            font-size: 1.2rem; 
            color: #ff7300; 
            padding: 5px 15px 15px 15px; 
            min-height: 30px; 
            text-align: right; 
            box-sizing: border-box;
            word-wrap: break-word;
        }
        
        .teclado { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
        }
        
        button { 
            width: 100%; 
            padding: 15px 5px; 
            font-size: 0.55rem; 
            cursor: pointer; 
            border: 4px solid #000000; 
            font-family: 'Press Start 2P', cursive;
            transition: none;
            box-shadow: 4px 4px 0px #000000;
        }
        
        button:active { 
            transform: translate(4px, 4px); 
            box-shadow: 0px 0px 0px #000000;
        }
        
        .btn-valor { background-color: #1d4ed8; color: #ffffff; }
        .btn-valor:hover { background-color: #2563eb; }
        .btn-operador { background-color: #ff7300; color: #ffffff; font-size: 1rem; }
        .btn-operador:hover { background-color: #fb923c; }
        .btn-clear { background-color: #dc2626; color: white; grid-column: span 1; }
        .btn-clear:hover { background-color: #ef4444; }
        .btn-equal { background-color: #ff7300; color: white; font-size: 1.2rem; grid-column: span 2; }
        .btn-equal:hover { background-color: #fb923c; }

        .redes-contenedor {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
        }

        .icono-red {
            background-color: #1d4ed8;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 6px;
            text-decoration: none;
            box-shadow: 3px 3px 0px #ff7300;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        .icono-red svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .icono-red:hover {
            background-color: #2563eb;
        }

        .icono-red:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #ff7300;
        }

        @media (max-width: 600px) {
            .redes-contenedor {
                bottom: 10px;
                right: 10px;
                gap: 8px;
            }
            .icono-red {
                padding: 5px;
                width: 16px;
                height: 16px;
                box-shadow: 2px 2px 0px #ff7300;
            }
            .icono-red svg {
                width: 12px;
                height: 12px;
            }
            .icono-red:active {
                transform: translate(2px, 2px);
                box-shadow: 0px 0px 0px #ff7300;
            }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>CALCULADORA<br>LAUCHA</h2>
        
        <button class="btn-espiar" onclick="toggleValores()">ESPIAR VALORES</button>

        <div class="diccionario" id="cajaValores">
            <strong>VALORES</strong>
            YUTA: 7 | TUYA: 9 | CANDIDA: -1<br><br>
            LIBRE: 10 | LOCA: 8 | LINDA: 5
        </div>

        <div class="pantalla-completa">
            <input type="text" id="pantallaFormula" readonly placeholder="...">
            <div id="resultadoArea">0</div>
        </div>

        <div class="teclado">
            <button class="btn-valor" onclick="añadirToken('YUTA')">YUTA</button>
            <button class="btn-valor" onclick="añadirToken('TUYA')">TUYA</button>
            <button class="btn-valor" onclick="añadirToken('CANDIDA')">CANDIDA</button>
            
            <button class="btn-valor" onclick="añadirToken('LIBRE')">LIBRE</button>
            <button class="btn-valor" onclick="añadirToken('LOCA')">LOCA</button>
            <button class="btn-valor" onclick="añadirToken('LINDA')">LINDA</button>
            
            <button class="btn-operador" onclick="añadirToken('+')">+</button>
            <button class="btn-operador" onclick="añadirToken('-')">-</button>
            <button class="btn-operador" onclick="añadirToken('*')">x</button>
            
            <button class="btn-operador" onclick="añadirToken('/')">/</button>
            <button class="btn-clear" onclick="limpiarCalculadora()">C</button>
            <button class="btn-equal" onclick="procesarCalculo()">=</button>
        </div>
    </div>

    <div class="redes-contenedor">
        <a href="https://www.linkedin.com/in/fabianavilla1991/" target="_blank" class="icono-red">
            <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
        </a>
        <a href="https://www.instagram.com/vabifilla/" target="_blank" class="icono-red">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </a>
    </div>

    <script>
        function toggleValores() {
            const caja = document.getElementById("cajaValores");
            if (caja.style.display === "block") {
                caja.style.display = "none";
            } else {
                caja.style.display = "block";
            }
        }

        const mapaValores = {
            "YUTA": 7,
            "TUYA": 9,
            "CANDIDA": -1,
            "LIBRE": 10,
            "LOCA": 8,
            "LINDA": 5
        };

        const operadoresValidos = ['+', '-', '*', '/'];
        let formulaActualString = "";

        const elPantallaFormula = document.getElementById("pantallaFormula");
        const elResultadoArea = document.getElementById("resultadoArea");

        function añadirToken(token) {
            if (formulaActualString === "") {
                formulaActualString = token;
            } else {
                formulaActualString += " " + token; 
            }
            if(elResultadoArea.innerHTML === "ERR" || elResultadoArea.innerHTML === "0") {
                elResultadoArea.innerHTML = "";
            }
            actualizarPantallas();
        }

        function limpiarCalculadora() {
            formulaActualString = "";
            elResultadoArea.innerHTML = "0";
            actualizarPantallas();
        }

        function actualizarPantallas() {
            elPantallaFormula.value = formulaActualString;
        }

        function procesarCalculo() {
            if (formulaActualString.trim() === "") return;

            let partesParsed = formulaActualString.trim().split(" ");
            let expresionFinalTraducida = "";

            for (let i = 0; i < partesParsed.length; i++) {
                let parte = partesParsed[i];
                if (parte === "") continue; 
                
                if (operadoresValidos.includes(parte)) {
                    expresionFinalTraducida += parte + " ";
                } else if (mapaValores[parte] !== undefined) {
                    let val = mapaValores[parte];
                    expresionFinalTraducida += (val < 0 ? "(" + val + ")" : val) + " ";
                } else {
                    elResultadoArea.innerHTML = "ERR";
                    return;
                }
            }

            try {
                let resultadoNumerico = eval(expresionFinalTraducida);
                if (!isFinite(resultadoNumerico)) {
                    elResultadoArea.innerHTML = "ERR";
                    return;
                }
                
                if(resultadoNumerico % 1 !== 0) {
                    resultadoNumerico = resultadoNumerico.toFixed(2);
                }
                
                elResultadoArea.innerHTML = resultadoNumerico;
            } catch (error) {
                elResultadoArea.innerHTML = "ERR";
            }
        }
    </script>
</body>
</html>
